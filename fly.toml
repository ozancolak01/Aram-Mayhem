# fly.toml for aram-mayhem
#
# IMPORTANT: game rooms live in the memory of ONE server process. Run exactly one machine
# (`fly scale count 1`); with two machines, friends can land on different servers and never see each other.

app = 'aram-mayhem'
primary_region = 'iad'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  # Rooms and running matches are in memory: never stop/sleep the machine while people may be playing.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    path = '/healthz'
    timeout = '5s'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
